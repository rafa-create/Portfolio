name: Clean BeatOnStep architecture staging

on:
  push:
    paths:
      - ".github/workflows/assemble-beatonstep-architecture.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-architecture
          rm -f .github/workflows/assemble-beatonstep-architecture.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean BeatOnStep architecture staging"
          git push
